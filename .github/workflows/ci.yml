name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Most of this suite is integration tests against a real MongoDB (twoNode.*, onStart,
    # artifactPortability, ...), and this workflow never had one -- every run has been failing on
    # ECONNREFUSED :27017 the whole time it's existed, silently, because nothing ever pointed that
    # out until a Docker-publish workflow's own CI run made the red X visible. Same service
    # container mesh's own ci.yml already uses.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck (src and test)
        run: npm run typecheck

      - name: Test
        run: npm test
